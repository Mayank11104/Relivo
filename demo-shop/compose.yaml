services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - CATALOG_URL=http://catalog-service:8000
      - ORDER_URL=http://order-service:8000
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shop
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/shop
      - INVENTORY_URL=http://inventory-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory-service:
    build: ./inventory-service
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shop
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
